<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 480px; height: 480px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #splash-bg {
      position: absolute;
      top: 0; left: 0;
      width: 480px; height: 480px;
      background: #080a0c;
      border-radius: 16px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }
    #logo-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.2s forwards;
    }
    #logo-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }
    #logo-name {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 300;
      color: #e8e8e8;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-align: center;
    }
    #logo-tagline {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: #333840;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
      text-align: center;
    }
    #splash-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 16px;
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="splash-bg"></div>
  <!-- Optional splash video. Drop a file at src/splash-video.mp4 and uncomment to enable.
  <video id="splash-video" src="./splash-video.mp4" autoplay muted playsinline style="display:block;"></video>
  -->
  <div id="logo-container">
    <img id="logo-img" src="../assets/icon.png" alt="Refluent">
    <div>
      <div id="logo-name">Refluent</div>
      <div id="logo-tagline">Creative Viewport</div>
    </div>
  </div>
</body>
</html>
